    <link rel="stylesheet" href="../web/css/style.css">
    <script>
        MathJax = { tex: { inlineMath: [['\\(','\\)']] }, svg: { fontCache: 'global' } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
    <div class="container">
        <h1>Hình Cầu</h1>

        <div class="calc-layout">
            <div class="calc-col-left">
                <div class="svg-wrap">
            <svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
                <circle cx="120" cy="110" r="75" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
                <ellipse cx="120" cy="110" rx="75" ry="25" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4,4"/>
                <line x1="120" y1="110" x2="195" y2="110" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4,3"/>
                <text id="svgLabelR" x="155" y="103" font-size="12" font-weight="600" fill="#e53e3e">R</text>
                <circle cx="120" cy="110" r="3" fill="#2b6cb0"/>
            </svg>
        </div>

        <div class="formula-box">
            <h2>📐 Công thức</h2>
            <ul>
                <li>Thể tích: \(V = \dfrac{4}{3}\pi R^3\)</li>
                <li>Diện tích mặt cầu: \(S = 4\pi R^2\)</li>
            </ul>
        </div>
            </div>
            <div class="calc-col-right">
                <div id="clientErrorBox" style="display:none; color: #b91c1c; margin-bottom: 15px; padding: 12px; background: #fee2e2; border-radius: 6px; border: 1px solid #f87171;"></div>
        <form class="calc-form" onsubmit="calculate(); return false;">
            <div class="form-row">
                <label>Bán kính (R):</label>
                <input type="number" id="inputR" step="any" name="r" required value="${param.r}" placeholder="Bán kính R">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-calc">⚡ Tính toán</button>
                <button type="reset" class="btn-reset" onclick="window.location.href=window.location.pathname">🔄 Làm mới</button>
            </div>
        </form>

        
        <div id="clientResultBox" class="result-box" style="display:none;">
            <h2>📊 Kết quả & Các bước giải chi tiết</h2>
            <div id="clientSteps"></div>
        </div>
    
                <a href="../" class="btn-home">🏠 Về trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        function updateSvgShape() {
            var inR = parseFloat(document.getElementById('inputR').value);
            document.getElementById('svgLabelR').textContent = (!isNaN(inR) && inR > 0) ? ('R = ' + inR) : 'R';
        }
        window.addEventListener('DOMContentLoaded', updateSvgShape);
        document.getElementById('inputR').addEventListener('input', updateSvgShape);
    </script>

    
    <script>
        function showError(msg) {
            var errBox = document.getElementById('clientErrorBox');
            errBox.style.display = 'block';
            errBox.innerHTML = '<strong>Lỗi:</strong> ' + msg;
            var resBox = document.getElementById('clientResultBox');
            if (resBox) resBox.style.display = 'none';
        }

        function showResult(steps) {
            var errBox = document.getElementById('clientErrorBox');
            if (errBox) errBox.style.display = 'none';

            var resBox = document.getElementById('clientResultBox');
            var stepsContainer = document.getElementById('clientSteps');
            stepsContainer.innerHTML = '';

            steps.forEach(function(s) {
                var div = document.createElement('div');
                div.className = 'step-detail';
                div.innerHTML = '<p><strong>' + s.t + '</strong></p>' +
                                '<p>\(' + s.m + '\) <strong>' + s.v + '</strong> <span class="unit-badge">' + s.u + '</span></p>';
                stepsContainer.appendChild(div);
            });

            resBox.style.display = 'block';
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([resBox]);
            }
        }
    </script>

    <script>
        
        function calculate() {
            var r = parseFloat(document.getElementById('inputR').value);
            if (isNaN(r) || r <= 0) { showError("Bán kính mặt cầu r phải lớn hơn 0."); return; }
            var s = 4 * Math.PI * r * r;
            var v = (4 / 3) * Math.PI * Math.pow(r, 3);
            showResult([
                { t: "1. Diện tích mặt cầu (S):", m: "S = 4\pi r^2 = 4 \times \pi \times " + r + "^2 \approx ", v: s.toFixed(4).replace(/\.?0+$/, ''), u: "đơn vị diện tích" },
                { t: "2. Thể tích khối cầu (V):", m: "V = \dfrac{4}{3}\pi r^3 = \dfrac{4}{3} \times \pi \times " + r + "^3 \approx ", v: v.toFixed(4).replace(/\.?0+$/, ''), u: "đơn vị thể tích" }
            ]);
        }
    
    </script>
</body>

</html>
