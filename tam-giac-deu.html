<body>
    <div class="container">
        <h1>Tam Giác Đều</h1>

        <div class="calc-layout">
            <div class="calc-col-left">
                <div class="svg-wrap">
            <svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
                <polygon points="120,25 25,175 215,175" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
                <line x1="120" y1="25" x2="120" y2="175" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4,3"/>
                <circle cx="120" cy="95" r="50" fill="none" stroke="#38a169" stroke-width="1" stroke-dasharray="3,3"/>
                <circle cx="120" cy="125" r="28" fill="none" stroke="#d69e2e" stroke-width="1" stroke-dasharray="3,3"/>
                <text id="svgLabelA" x="120" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#2b6cb0">a</text>
                <text x="125" y="105" font-size="11" fill="#e53e3e">h</text>
            </svg>
        </div>

        <div class="formula-box">
            <h2>📐 Công thức</h2>
            <ul>
                <li>Chu vi: \(C = 3a\)</li>
                <li>Diện tích: \(S = \dfrac{a^2\sqrt{3}}{4}\)</li>
                <li>Chiều cao: \(h = \dfrac{a\sqrt{3}}{2}\)</li>
                <li>Bán kính ngoại tiếp: \(R = \dfrac{a\sqrt{3}}{3}\)</li>
                <li>Bán kính nội tiếp: \(r = \dfrac{a\sqrt{3}}{6}\)</li>
            </ul>
        </div>
            </div>
            <div class="calc-col-right">
                <div id="clientErrorBox" style="display:none; color: #b91c1c; margin-bottom: 15px; padding: 12px; background: #fee2e2; border-radius: 6px; border: 1px solid #f87171;"></div>
        <form class="calc-form" onsubmit="calculate(); return false;">
            <div class="form-row">
                <label>Cạnh (a):</label>
                <input type="number" id="inputA" step="any" name="a" required value="${param.a}" placeholder="Nhập cạnh a">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-calc">Tính toán</button>
                <button type="reset" class="btn-reset" onclick="window.location.href=window.location.pathname">Làm mới</button>
            </div>
        </form>

        
        <div id="clientResultBox" class="result-box" style="display:none;">
            <h2>📊 Kết quả & Các bước giải chi tiết</h2>
            <div id="clientSteps"></div>
        </div>
    
                <a href="index.html" class="btn-home">Về trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        function updateSvgShape() {
            var inA = parseFloat(document.getElementById('inputA').value);
            document.getElementById('svgLabelA').textContent = (!isNaN(inA) && inA > 0) ? ('a = ' + inA) : 'a';
        }
        window.addEventListener('DOMContentLoaded', updateSvgShape);
        document.getElementById('inputA').addEventListener('input', updateSvgShape);
    </script>

    
    <script>
        function showError(msg) {
            var errBox = document.getElementById('clientErrorBox');
            errBox.style.display = 'block';
            errBox.innerHTML = '<strong>Lỗi:</strong> ' + msg;
            var resBox = document.getElementById('clientResultBox');
            if (resBox) resBox.style.display = 'none';
        }

        function showResult(steps) {
            var errBox = document.getElementById('clientErrorBox');
            if (errBox) errBox.style.display = 'none';

            var resBox = document.getElementById('clientResultBox');
            var stepsContainer = document.getElementById('clientSteps');
            stepsContainer.innerHTML = '';

            steps.forEach(function(s) {
                var div = document.createElement('div');
                div.className = 'step-detail';
                div.innerHTML = '<p><strong>' + s.t + '</strong></p>' +
                                '<p>\(' + s.m + '\) <strong>' + s.v + '</strong> <span class="unit-badge">' + s.u + '</span></p>';
                stepsContainer.appendChild(div);
            });

            resBox.style.display = 'block';
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([resBox]);
            }
        }
    </script>

    <script>
        
        function calculate() {
            var a = parseFloat(document.getElementById('inputA').value);
            if (isNaN(a) || a <= 0) { showError("Cạnh tam giác đều phải lớn hơn 0."); return; }
            var p = 3 * a;
            var h = (a * Math.sqrt(3)) / 2;
            var s = (a * a * Math.sqrt(3)) / 4;
            var r = (a * Math.sqrt(3)) / 3;
            showResult([
                { t: "1. Chu vi (C):", m: "C = 3a = 3 \times " + a + " = ", v: p.toFixed(4).replace(/\.?0+$/, ''), u: "đơn vị dài" },
                { t: "2. Chiều cao (h):", m: "h = \dfrac{a\sqrt{3}}{2} \approx ", v: h.toFixed(4).replace(/\.?0+$/, ''), u: "đơn vị dài" },
                { t: "3. Diện tích (S):", m: "S = \dfrac{a^2\sqrt{3}}{4} \approx ", v: s.toFixed(4).replace(/\.?0+$/, ''), u: "đơn vị diện tích" },
                { t: "4. Bán kính ngoại tiếp (R):", m: "R = \dfrac{a\sqrt{3}}{3} \approx ", v: r.toFixed(4).replace(/\.?0+$/, ''), u: "đơn vị dài" }
            ]);
        }
    
    </script>
</body>
